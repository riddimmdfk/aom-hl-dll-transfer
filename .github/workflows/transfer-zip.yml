name: Transfer DLL archive
on:
  workflow_dispatch:
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: aom-hl-dll-archive
          path: AOM_hl_dll.zip
          if-no-files-found: error
          retention-days: 1
